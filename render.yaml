services:
  - type: web
    name: mc-bot-manager
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: MC_HOST
        sync: false
      - key: MC_PORT
        value: "25565"
      - key: MC_VERSION
        value: "1.21.11"
      - key: BOT_COUNT
        value: "1"
      - key: RECONNECT_DELAY
        value: "10000"
      - key: PANEL_PASSWORD
        sync: false
      - key: BOT_NAMES
        value: "GP_AFK,GP_Player,GP_Lobby,GP_Online,GP_Survival"
      - key: JOIN_COMMAND
        value: ""
      - key: LOGIN_COMMAND
        sync: false
      - key: LOGIN_DELAY
        value: "2500"
