# Authorized benchmark plan
# This file intentionally contains no network target or client-generation logic.

authorization:
  required: true
  operator_confirmation: "I own or have written authorization to test the target infrastructure."

stages:
  - concurrent_clients: 25
    hold_seconds: 300
  - concurrent_clients: 50
    hold_seconds: 300
  - concurrent_clients: 100
    hold_seconds: 300
  - concurrent_clients: 150
    hold_seconds: 300
  - concurrent_clients: 200
    hold_seconds: 300

ramp:
  pause_between_stages_seconds: 120
  require_manual_approval: true

stop_conditions:
  - tps_below: 18
  - sustained_cpu_percent_above: 90
  - sustained_ram_percent_above: 90
  - operator_reports_instability: true

metrics:
  record:
    - timestamp
    - stage
    - cpu_percent
    - ram_mb
    - tps
    - latency_ms
    - notes
